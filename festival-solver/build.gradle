plugins {
    id "com.android.library"
}

android {
    namespace "my.boxman.solver"
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        minSdk 23

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}
